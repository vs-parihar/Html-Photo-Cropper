<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pro Photo Canvas</title><style>:root{--bg-base:#0a0a0a;--bg-panel:#141414;--bg-input:#222;--bg-hover:#333;--accent:#007bff;--accent-hover:#0056b3;--text-main:#f0f0f0;--text-muted:#888;--border:#2a2a2a;--radius:0.5rem;--<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pro Photo Canvas</title><style>:root{--bg-base:#0a0a0a;--bg-panel:#141414;--bg-input:#222;--bg-hover:#333;--accent:#007bff;--accent-hover:#0056b3;--text-main:#f0f0f0;--text-muted:#888;--border:#2a2a2a;--radius:0.5rem;--radius-sm:0.25rem;--font:system-ui,-apple-system,sans-serif}*{box-sizing:border-box;margin:0;padding:0}body{background-color:var(--bg-base);color:var(--text-main);font-family:var(--font);height:100dvh;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior-y:none}.app-header{display:flex;justify-content:space-between;align-items:center;padding:0.75rem 1rem;background:var(--bg-panel);border-bottom:1px solid var(--border);z-index:10}.app-title{font-size:1.1rem;font-weight:600}.live-stats{display:flex;gap:1rem;font-size:0.85rem;color:var(--accent);font-family:monospace;background:var(--bg-input);padding:0.4rem 0.8rem;border-radius:var(--radius)}.main-workspace{display:flex;flex:1;overflow:hidden;flex-direction:column}@media(min-width:768px){.main-workspace{flex-direction:row}.controls-panel{width:320px!important;height:100%!important;border-top:none!important;border-left:1px solid var(--border)}}.canvas-area{flex:1;display:flex;align-items:center;justify-content:center;background-color:#050505;background-size:20px 20px;overflow:hidden;position:relative;touch-action:none}canvas{width:95%;height:95%;max-width:95%;max-height:95%;box-shadow:0 4px 20px rgba(0,0,0,0.8);object-fit:contain;border:1px solid #333}.controls-panel{width:100%;height:40dvh;background:var(--bg-panel);border-top:1px solid var(--border);display:flex;flex-direction:column;z-index:5}.tabs{display:flex;border-bottom:1px solid var(--border)}.tab-btn{flex:1;padding:0.75rem;background:transparent;border:none;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent}.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}.tab-content{display:none;flex:1;overflow-y:auto;padding:1rem;gap:1.25rem}.tab-content.active{display:flex;flex-direction:column}.control-group{display:flex;flex-direction:column;gap:0.5rem}.control-group label{font-size:0.8rem;text-transform:uppercase;color:var(--text-muted)}.input-row{display:flex;gap:0.5rem}input[type="number"],select,input[type="color"]{width:100%;padding:0.5rem;background:var(--bg-input);border:1px solid var(--border);color:var(--text-main);border-radius:var(--radius-sm)}input[type="range"]{width:100%;accent-color:var(--accent)}button{padding:0.6rem 1rem;background:var(--bg-input);color:var(--text-main);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:white;margin-top:auto}.anchor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:120px;margin:0 auto}.anchor-btn{aspect-ratio:1;padding:0;display:flex;align-items:center;justify-content:center;background:var(--bg-input)}.anchor-btn::after{content:'';width:6px;height:6px;background:var(--text-muted);border-radius:50%}.file-upload-wrapper{position:relative;overflow:hidden;display:inline-block;width:100%}.file-upload-wrapper input[type=file]{font-size:100px;position:absolute;left:0;top:0;opacity:0;cursor:pointer}.file-upload-btn{width:100%;border:1px dashed var(--border);background:transparent;padding:1.5rem}.val-display{float:right;color:var(--accent)}.hint-text{font-size:0.75rem;color:var(--text-muted)}</style></head><body>
<header class="app-header"><div class="app-title">Pro Canvas</div><div class="live-stats"><span id="stat-res">0x0 (0:0)</span><span id="stat-size">0 KB</span></div></header>
<main class="main-workspace"><div class="canvas-area" id="canvas-container"><canvas id="editor-canvas"></canvas></div><aside class="controls-panel"><div class="tabs"><button class="tab-btn" data-tab="tab-layout">Layout</button><button class="tab-btn active" data-tab="tab-image">Image</button><button class="tab-btn" data-tab="tab-export">Export</button></div>
<div class="tab-content" id="tab-layout"><div class="control-group"><label>Presets</label><select id="preset-select"><option value="auto">Original</option><option value="custom">Custom</option><optgroup label="Social"><option value="1080:1080">Insta Square (1:1)</option><option value="1080:1350">Insta Portrait (4:5)</option><option value="1080:1920">Story/Reel (9:16)</option><option value="1200:630">FB Post</option></optgroup><optgroup label="Screen"><option value="1920:1080">FHD (16:9)</option><option value="3840:2160">4K UHD</option></optgroup><optgroup label="Print/Photo"><option value="2480:3508">A4 (300 DPI)</option><option value="1200:1800">4x6 Photo</option><option value="1500:2100">5x7 Photo</option><option value="413:531">Passport (35x45mm)</option></optgroup></select></div><div class="control-group"><label>Custom (px)</label><div class="input-row"><input type="number" id="canvas-w"><input type="number" id="canvas-h"></div><label style="font-size:0.7rem;display:flex;align-items:center;gap:0.3rem"><input type="checkbox" id="lock-ratio" checked> Lock Aspect Ratio</label></div><div class="control-group"><label>BG Fill</label><div class="input-row"><input type="color" id="bg-color" value="#000000"><button id="bg-transparent" style="flex:1">Trans</button></div></div><div class="control-group"><label>Preview Size <span id="view-val" class="val-display">95%</span></label><input type="range" id="view-slider" min="10" max="95" step="1" value="95"></div></div>
<div class="tab-content active" id="tab-image"><div class="input-row"><div class="file-upload-wrapper" style="flex:2"><button class="file-upload-btn">Choose Image</button><input type="file" id="file-input" accept="image/*"></div><button id="btn-fit" style="flex:1">Fit</button></div><div class="control-group"><label>Align</label><div class="anchor-grid"><button class="anchor-btn" data-align="tl"></button><button class="anchor-btn" data-align="tc"></button><button class="anchor-btn" data-align="tr"></button><button class="anchor-btn" data-align="ml"></button><button class="anchor-btn" data-align="mc"></button><button class="anchor-btn" data-align="mr"></button><button class="anchor-btn" data-align="bl"></button><button class="anchor-btn" data-align="bc"></button><button class="anchor-btn" data-align="br"></button></div></div><div class="control-group"><label>Scale <span id="scale-val" class="val-display">100%</span></label><input type="range" id="scale-slider" min="0.1" max="5" step="0.0001" value="1"><label style="font-size:0.7rem;display:flex;align-items:center;gap:0.3rem"><input type="checkbox" id="fine-scale"> Fine Mode (Relative)</label></div></div>
<div class="tab-content" id="tab-export"><div class="control-group"><label>Format</label><select id="export-format"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WEBP</option></select></div><div class="control-group"><label>Quality <span id="quality-val" class="val-display">90%</span></label><input type="range" id="quality-slider" min="0" max="1" step="0.01" value="0.9"></div><button class="primary" id="btn-download">Download</button></div></aside></main>
<script>
const s={img:null,imgX:0,imgY:0,scale:1,canvasW:1920,canvasH:1080,aspect:1920/1080,bgColor:'#000000',isTransparent:false,format:'image/jpeg',quality:0.9,isDragging:false,dragStartX:0,dragStartY:0,lastPinchDist:null},c=document.getElementById('editor-canvas'),ctx=c.getContext('2d',{willReadFrequently:true}),container=document.getElementById('canvas-container'),UI={p:document.getElementById('preset-select'),w:document.getElementById('canvas-w'),h:document.getElementById('canvas-h'),lr:document.getElementById('lock-ratio'),bg:document.getElementById('bg-color'),bt:document.getElementById('bg-transparent'),fi:document.getElementById('file-input'),fit:document.getElementById('btn-fit'),ss:document.getElementById('scale-slider'),sv:document.getElementById('scale-val'),fs:document.getElementById('fine-scale'),f:document.getElementById('export-format'),qs:document.getElementById('quality-slider'),qv:document.getElementById('quality-val'),sr:document.getElementById('stat-res'),sz:document.getElementById('stat-size'),dl:document.getElementById('btn-download'),vs:document.getElementById('view-slider'),vv:document.getElementById('view-val')};
function draw(){c.width=s.canvasW;c.height=s.canvasH;ctx.clearRect(0,0,c.width,c.height);if(!s.isTransparent){ctx.fillStyle=s.bgColor;ctx.fillRect(0,0,c.width,c.height)}if(s.img){ctx.save();ctx.translate(s.imgX,s.imgY);ctx.scale(s.scale,s.scale);ctx.drawImage(s.img,0,0);ctx.restore()}ctx.strokeStyle='rgba(80,80,80,0.8)';ctx.lineWidth=2;ctx.strokeRect(0,0,s.canvasW,s.canvasH);const gcd=(a,b)=>b?gcd(b,a%b):a,g=gcd(s.canvasW,s.canvasH);UI.sr.textContent=`${s.canvasW}×${s.canvasH} (${s.canvasW/g}:${s.canvasH/g})`;reqSz()}
let szT;function reqSz(){clearTimeout(szT);szT=setTimeout(()=>{c.toBlob(b=>{if(b){const k=(b.size/1024).toFixed(1);UI.sz.textContent=b.size>1048576?`${(b.size/1048576).toFixed(2)}MB`:`${k}KB`}},s.format,s.quality)},300)}
UI.fi.onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>25*1024*1024)return alert('File too large (>25MB)');s.origName=f.name.replace(/\.[^/.]+$/,"");const r=new FileReader();r.onload=ev=>{const i=new Image();i.onerror=()=>alert('Failed to load image');i.onload=()=>{if(i.width*i.height>100000000)return alert('Image resolution too high');s.img=i;s.isTransparent=false;s.bgColor='#000000';UI.bg.value='#000000';setSz(i.width,i.height);resTr();draw()};i.src=ev.target.result};r.readAsDataURL(f);e.target.value=''};
function resTr(){if(!s.img)return;s.scale=Math.min(s.canvasW/s.img.width,s.canvasH/s.img.height);s.imgX=(s.canvasW-s.img.width*s.scale)/2;s.imgY=(s.canvasH-s.img.height*s.scale)/2;updS()}
function setSz(w,h,k){s.canvasW=Math.max(1,Math.round(w));s.canvasH=Math.max(1,Math.round(h));if(!k)s.aspect=s.canvasW/s.canvasH;UI.w.value=s.canvasW;UI.h.value=s.canvasH}
UI.w.oninput=e=>{const nw=Math.max(1,parseInt(e.target.value)||1);if(UI.lr.checked)setSz(nw,nw/s.aspect,true);else setSz(nw,s.canvasH);UI.p.value='custom';resTr();draw()};UI.h.oninput=e=>{const nh=Math.max(1,parseInt(e.target.value)||1);if(UI.lr.checked)setSz(nh*s.aspect,nh,true);else setSz(s.canvasW,nh);UI.p.value='custom';resTr();draw()};
UI.p.onchange=e=>{const v=e.target.value;if(v==='auto'&&s.img)setSz(s.img.width,s.img.height);else if(v.includes(':')){const[w,h]=v.split(':').map(Number);if(w>20)setSz(w,h);else{if(w>=h)setSz(s.canvasW,s.canvasW*(h/w));else setSz(s.canvasH*(w/h),s.canvasH)}}resTr();draw()};
UI.bg.oninput=e=>{s.bgColor=e.target.value;s.isTransparent=false;draw()};UI.bt.onclick=()=>{s.isTransparent=true;draw()};
UI.f.onchange=e=>{s.format=e.target.value;draw()};UI.qs.oninput=e=>{s.quality=parseFloat(e.target.value);UI.qv.textContent=Math.round(s.quality*100)+'%';draw()};
function updS(){if(!UI.fs.checked){UI.ss.min=0.1;UI.ss.max=5;UI.ss.value=s.scale}else{const cur=s.baseScale||s.scale;UI.ss.min=cur*0.98;UI.ss.max=cur*1.02;UI.ss.value=s.scale}UI.sv.textContent=(s.scale*100).toFixed(2)+'%'};
UI.ss.oninput=e=>{if(!s.img)return;const n=parseFloat(e.target.value);zm(s.canvasW/2,s.canvasH/2,n/s.scale)};UI.fs.onchange=()=>{if(UI.fs.checked)s.baseScale=s.scale;else s.baseScale=null;updS()};
document.querySelectorAll('.anchor-btn').forEach(b=>b.onclick=e=>{if(!s.img)return;const a=e.target.dataset.align,cw=s.canvasW,ch=s.canvasH,iw=s.img.width*s.scale,ih=s.img.height*s.scale;if(a.includes('l'))s.imgX=0;if(a.includes('c'))s.imgX=(cw-iw)/2;if(a.includes('r'))s.imgX=cw-iw;if(a.includes('t'))s.imgY=0;if(a.includes('m'))s.imgY=(ch-ih)/2;if(a.includes('b'))s.imgY=ch-ih;draw()});
function getP(cx,cy){const r=c.getBoundingClientRect();return{x:(cx-r.left)*(c.width/r.width),y:(cy-r.top)*(c.height/r.height)}}
function zm(px,py,f){if(!s.img)return;const n=Math.max(0.01,Math.min(s.scale*f,20));s.imgX=px-(px-s.imgX)*(n/s.scale);s.imgY=py-(py-s.imgY)*(n/s.scale);s.scale=n;updS();draw()}
container.onmousedown=e=>{if(!s.img)return;s.isDragging=true;const p=getP(e.clientX,e.clientY);s.dragStartX=p.x-s.imgX;s.dragStartY=p.y-s.imgY};
window.onmousemove=e=>{if(!s.isDragging||!s.img)return;const p=getP(e.clientX,e.clientY);s.imgX=p.x-s.dragStartX;s.imgY=p.y-s.dragStartY;draw()};
window.onmouseup=()=>s.isDragging=false;
container.onwheel=e=>{if(!s.img)return;e.preventDefault();const p=getP(e.clientX,e.clientY);zm(p.x,p.y,e.deltaY<0?1.1:0.9)};
container.ontouchstart=e=>{if(!s.img)return;if(e.touches.length===1){s.isDragging=true;const p=getP(e.touches[0].clientX,e.touches[0].clientY);s.dragStartX=p.x-s.imgX;s.dragStartY=p.y-s.imgY}else if(e.touches.length===2){s.isDragging=false;s.lastPinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}};
container.ontouchmove=e=>{if(!s.img)return;e.preventDefault();if(e.touches.length===1&&s.isDragging){const p=getP(e.touches[0].clientX,e.touches[0].clientY);s.imgX=p.x-s.dragStartX;s.imgY=p.y-s.dragStartY;draw()}else if(e.touches.length===2&&s.lastPinchDist){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);const f=d/s.lastPinchDist;const p=getP((e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2);zm(p.x,p.y,f);s.lastPinchDist=d}};
container.ontouchend=e=>{if(e.touches.length<2)s.lastPinchDist=null;if(e.touches.length===0)s.isDragging=false};
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab-btn,.tab-content').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});
UI.dl.onclick=()=>{try{const gcd=(a,b)=>b?gcd(b,a%b):a,g=gcd(s.canvasW,s.canvasH),suff=`_${s.canvasW}x${s.canvasH}_${s.canvasW/g}-${s.canvasH/g}`,name=(s.origName||'canvas').replace(/_\d+x\d+_\d+-\d+$/,'')+suff;c.toBlob(b=>{if(!b)return alert('Export failed: Canvas too large for browser memory');const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`${name}.${s.format.split('/')[1].replace('jpeg','jpg')}`;a.click();setTimeout(()=>URL.revokeObjectURL(u),100)},s.format,s.quality)}catch(e){alert('Export error: '+e.message)}};
UI.vs.oninput=e=>{const v=e.target.value;c.style.maxWidth=v+'%';c.style.maxHeight=v+'%';UI.vv.textContent=v+'%'};UI.fit.onclick=()=>{if(!s.img)return;const fi=s.canvasW/s.img.width<s.canvasH/s.img.height?s.canvasW/s.img.width:s.canvasH/s.img.height,fo=s.canvasW/s.img.width>s.canvasH/s.img.height?s.canvasW/s.img.width:s.canvasH/s.img.height;s.scale=(s.scale.toFixed(4)===fi.toFixed(4))?fo:fi;s.imgX=(s.canvasW-s.img.width*s.scale)/2;s.imgY=(s.canvasH-s.img.height*s.scale)/2;updS();draw()};setSz(1920,1080);draw();
</script></body></html>
